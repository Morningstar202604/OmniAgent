name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build type graph (tsc -b) before lint
        run: npx tsc -b

      - name: Lint (oxlint, single-thread for low-memory hosts)
        run: pnpm exec oxlint --threads 1 .

      - name: Build host lib
        run: pnpm run build:lib:host

      - name: Build client lib
        run: pnpm run build:lib:client

      - name: Build web
        run: pnpm run build:web

      - name: Smoke — 官网可访问
        run: curl -sf -o /dev/null -w "official site HTTP %{http_code}\n" https://x33834.github.io/OmniAgent/ || echo "site not yet reachable (Pages build may lag)"

  site:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 官网 smoke（Pages 内置自动构建，此步仅确认 200）
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L https://x33834.github.io/OmniAgent/ || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
