name: Mirror to GitCode & Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.repository == 'X33834/OmniAgent'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME || 'badhope' }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL || 'badhope@users.noreply.gitcode.com' }}"

      - name: 镜像到 GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then echo "skip: GITCODE_TOKEN 未配置"; exit 0; fi
          git push --force \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/badhope/OmniAgent.git" \
            main:main

      - name: 镜像到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then echo "skip: GITEE_TOKEN 未配置"; exit 0; fi
          git push --force \
            "https://badhope:${GITEE_TOKEN}@gitee.com/badhope/omniagent.git" \
            main:main
