# OmniAgent finance bundle patch: 通用全能底座 + 金融专业插件 + 金融专业面板。
# 用法: oa --profile finance --no-open（Web 界面瞬变金融终端），
# 或在 Web 插件页（侧栏「插件」）启用官方组合包 @deepseek-ai/dsh-finance。
# 数据源默认 mock（内置示例）；接入真实数据: source: http + baseURL + apiKeyEnv。

- insert:
    - id: finance-agent
      name: '@deepseek-ai/dsh-finance-agent'
      config:
        source: mock
        # 接入真实行情/财务数据服务时改为:
        # source: http
        # baseURL: https://your-finance-gateway.example/v1
        # apiKeyEnv: FINANCE_API_KEY

    # 报告导出：Markdown / HTML 专业报告（PDF 渲染为后续路线）。
    - id: report-export
      name: '@deepseek-ai/dsh-report-export'

    # 多智能体协作：agent_team_run 按角色并行编排（复用 spawn 子代理 provider）。
    - id: agent-team
      name: '@deepseek-ai/dsh-agent-team'
      config:
        provider: spawn

    # 金融专业面板（浏览器半边）：仅随本组合包挂载，把中心对话区瞬变为金融终端。
    # web profile 不挂载本行，故通用界面保持不变。
    - id: ui-finance
      name: '@deepseek-ai/dsh-client-ui-finance'

# 默认模型路由：OpenAI 协议（DeepSeek 兼容端点），与底座 llm-pi-ai 配合。
- id: agent-default-model
  config:
    provider: deepseek-openai
    model: deepseek-chat

# pi-ai 在 base 中以零路由启动（等待用户在 Models 页配置）；本组合包提供
# 开箱即用的默认 provider 路由，让领域 profile 不配置即可对话（配 DEEPSEEK_API_KEY）。
- id: llm-pi-ai
  config:
    providers:
      deepseek-openai:
        displayName: DeepSeek（OpenAI 兼容）
        api: openai-completions
        baseURL: https://api.deepseek.com/v1
        apiKeyEnv: DEEPSEEK_API_KEY
        models:
          - id: deepseek-chat
            name: DeepSeek Chat
            contextWindow: 65536
          - id: deepseek-reasoner
            name: DeepSeek Reasoner
            contextWindow: 65536
            reasoningEfforts:
              off:
              high: high
